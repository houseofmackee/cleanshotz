[workspace]
members = ["xtask"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "cleanshotz"
version = "0.1.0"
edition = "2024"
description = "A native macOS screenshot, screen recording and annotation tool"
license = "MIT OR Apache-2.0"
repository = "https://github.com/houseofmackee/cleanshotz"
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
block2 = "0.6"
dispatch2 = "0.3"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-av-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-image-io = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-vision = "0.3"
regex = "1"
objc2-service-management = "0.3"
serde_json = { version = "1", features = ["float_roundtrip"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
