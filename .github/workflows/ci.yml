name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Captions need the macOS 26 SDK (Xcode 26); fail rather than build
  # without them.
  CLEANSHOTZ_REQUIRE_CAPTIONS: 1

jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Debug-only code paths can leave release builds with dead code.
      - run: cargo clippy --workspace --all-targets --release -- -D warnings
      - run: cargo test --workspace
      - run: cargo xtask bundle --release

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
