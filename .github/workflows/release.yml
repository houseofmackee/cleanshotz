name: Release

# Builds, signs and publishes a release when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# Tags with a hyphen (v0.2.0-beta.1) become pre-releases.
#
# Signs with a Developer ID and notarizes. Needs these repository secrets:
#   DEVELOPER_ID_P12_BASE64    the Developer ID Application certificate and key
#   DEVELOPER_ID_P12_PASSWORD  its password
#   NOTARY_API_KEY_BASE64      an App Store Connect API key (.p8, Developer role)
# and these variables: APPLE_TEAM_ID, NOTARY_KEY_ID, NOTARY_ISSUER_ID.
# Every release must be signed by the same team: the signature is what
# keeps users' Screen Recording and other permissions across updates.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Import the signing certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::DEVELOPER_ID_P12_BASE64 and DEVELOPER_ID_P12_PASSWORD must be set"
            exit 1
          fi
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          security import "$RUNNER_TEMP/release.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/release.p12"
          # Apple's Developer ID G2 intermediate, so the identity is valid.
          curl -sSfL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          fingerprint=$(openssl x509 -inform der -in "$RUNNER_TEMP/DeveloperIDG2CA.cer" -noout -fingerprint -sha256 | cut -d= -f2)
          if [ "$fingerprint" != "F1:6C:D3:C5:4C:7F:83:CE:A4:BF:1A:3E:6A:08:19:C8:AA:A8:E4:A1:52:8F:D1:44:71:5F:35:06:43:D2:DF:3A" ]; then
            echo "::error::unexpected Developer ID G2 intermediate certificate"
            exit 1
          fi
          security add-certificates -k "$keychain" "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"

      - name: Write the notary key
        env:
          KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
        run: |
          if [ -z "$KEY_BASE64" ]; then
            echo "::error::NOTARY_API_KEY_BASE64 must be set"
            exit 1
          fi
          echo "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"

      - name: Build, notarize and package
        env:
          CLEANSHOTZ_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          CLEANSHOTZ_NOTARY_KEY: ${{ runner.temp }}/notary.p8
          CLEANSHOTZ_NOTARY_KEY_ID: ${{ vars.NOTARY_KEY_ID }}
          CLEANSHOTZ_NOTARY_ISSUER: ${{ vars.NOTARY_ISSUER_ID }}
        run: |
          if [ -z "$CLEANSHOTZ_TEAM_ID" ] || [ -z "$CLEANSHOTZ_NOTARY_KEY_ID" ] || [ -z "$CLEANSHOTZ_NOTARY_ISSUER" ]; then
            echo "::error::the APPLE_TEAM_ID, NOTARY_KEY_ID and NOTARY_ISSUER_ID variables must be set"
            exit 1
          fi
          cargo xtask dist
          # Fail rather than publish anything Gatekeeper would block.
          xcrun stapler validate "target/dist/CleanShotZ-${GITHUB_REF_NAME#v}.dmg"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" <<NOTES
          ## Installing

          Download \`CleanShotZ-$version.dmg\` (or the zip), open it and drag CleanShotZ into Applications. It is signed with a Developer ID and notarized by Apple, so it opens like any other app.

          Requires macOS 14 or later on Apple silicon. Checksums are in \`SHA256SUMS.txt\`.
          NOTES
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $prerelease --generate-notes --notes-file "$notes" \
            --title "CleanShotZ $version" \
            target/dist/CleanShotZ-$version.dmg target/dist/CleanShotZ-$version.zip target/dist/SHA256SUMS.txt

      - name: Remove the temporary keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"
